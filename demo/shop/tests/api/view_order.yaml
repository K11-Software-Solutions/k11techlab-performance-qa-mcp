name: Customer views an order and their order history
description: >
  As a customer, after placing an order I can open it and see it in my order history.
  Used as realistic traffic for load tests (mostly reads, one write).
tags: [orders, perf]
fixtures: [customer]
steps:
  - name: place an order
    call: POST /orders
    body:
      customerId: "${fixture.customer.id}"
      channel: web
      items: [{ sku: HAT-2, qty: 1 }]
    expect: { status: 201 }
    save: { orderId: "$.id" }
  - name: open the order
    call: GET /orders/{id}
    path: { id: "${orderId}" }
    expect: { status: 200, json: { "$.status": pending } }
  - name: open it again (refresh)
    call: GET /orders/{id}
    path: { id: "${orderId}" }
    expect: { status: 200 }
  - name: order history
    call: GET /orders
    query: { customerId: "${fixture.customer.id}" }
    expect: { status: 200 }
