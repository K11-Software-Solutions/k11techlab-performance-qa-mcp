[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k11-performance-qa-mcp"
version = "0.1.0"
description = "MCP server and CI tool for load and performance testing as release evidence: API flows as load scenarios, per-endpoint latency and SLOs, statistically significant regressions against a baseline, k6 or builtin engine, with guardrails."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K11 Software Solutions" }]
requires-python = ">=3.10"
keywords = ["mcp", "performance-testing", "load-testing", "k6", "slo", "latency", "regression", "qa", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing :: Traffic Generation",
]
dependencies = ["k11-api-functional-qa-mcp>=0.1.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/K11-Software-Solutions/k11techlab-performance-qa-mcp"
Issues = "https://github.com/K11-Software-Solutions/k11techlab-performance-qa-mcp/issues"

[project.scripts]
k11-performance-qa-mcp = "k11_perf_qa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k11_perf_qa"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
